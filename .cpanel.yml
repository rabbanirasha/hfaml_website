---
deployment:
  tasks:
    - export DEPLOYPATH=/home/hfasset/hfasset_website/
    - export WEBROOT=/home/hfasset/public_html/
    - export PHP=/opt/cpanel/ea-php85/root/usr/bin/php
    - $PHP $DEPLOYPATH/artisan migrate --force
    - $PHP $DEPLOYPATH/artisan config:cache
    - $PHP $DEPLOYPATH/artisan route:cache
    - $PHP $DEPLOYPATH/artisan view:cache
    - rsync -a --delete --exclude='index.php' --exclude='.well-known' $DEPLOYPATH/public/ $WEBROOT
    - cp $DEPLOYPATH/deploy/index.production.php $WEBROOT/index.php
    - cp $DEPLOYPATH/deploy/production.htaccess $WEBROOT/.htaccess
    - if [ ! -L $WEBROOT/storage ]; then ln -s $DEPLOYPATH/storage/app/public $WEBROOT/storage; fi